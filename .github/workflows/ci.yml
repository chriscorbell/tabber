name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if a release was published by hand
        id: existing
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (published with a locally notarized DMG); not overwriting it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install XcodeGen
        if: steps.existing.outputs.skip != 'true'
        run: brew install xcodegen
      - name: Import signing certificate
        if: steps.existing.outputs.skip != 'true' && (secrets.DEVELOPER_ID_P12 != '')
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Build app
        if: steps.existing.outputs.skip != 'true'
        env:
          TABBER_ADHOC: ${{ secrets.DEVELOPER_ID_P12 == '' && '1' || '' }}
        run: scripts/build-app.sh
      - name: Notarize
        if: steps.existing.outputs.skip != 'true' && (secrets.NOTARY_KEY != '')
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" > notary.p8
          ditto -c -k --keepParent build/Tabber.app build/Tabber-notarize.zip
          xcrun notarytool submit build/Tabber-notarize.zip --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple build/Tabber.app
          rm notary.p8
      - name: Package
        if: steps.existing.outputs.skip != 'true'
        run: scripts/package-dmg.sh
      - name: Publish release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Tabber.dmg
          generate_release_notes: true
